apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operation-phase.fullname" . }}
  labels:
    {{- include "operation-phase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "operation-phase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "operation-phase.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "operation-phase.serviceAccountName" . }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: PROMETHEUS_URL
          value: "{{ .Values.prometheusUrl }}"
        - name: LOG_LEVEL
          value: "{{ .Values.logLevel }}"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
